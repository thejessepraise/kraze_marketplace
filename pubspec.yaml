name: kraze_student_marketplace
description: "A Student Marketplace"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default:21

flutter_native_splash:
  color: "#121212"
  # image: "assets/images/app_icon.png"
  
  android_12:
    color: "#121212"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Glitch
      fonts:
        - asset: assets/fonts/Doctor Glitch.otf
